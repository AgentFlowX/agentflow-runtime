name: tg_ops
version: 0.1.0
description: "Native Telegram-userbot primitives — own/buy accounts and talk to people from one or many accounts (send + multi-account inbound poll + conversation history), with no campaign and no warmup gate. Mailing/warmup are separate opt-in modules that build on the same tables."
author: AgentFlow
kind: backend
tags:
  - telegram
  - userbot
  - primitives
pip_dependencies:
  - telethon
  - sqlmodel
  - qrcode        # optional: render the login QR to PNG (best-effort, falls back to url)
  - pillow
python_dependencies:
  - telethon
  - sqlmodel
  - qrcode
  - pillow
provides_tools:
  - tg_account_qr_start
  - tg_create_bot
  - tg_send_media
  - tg_exec
  - tg_tool_define
  - tg_tool_run
  - tg_tool_list
  - tg_tool_delete
  - tg_autopilot_set
  - tg_autopilot_start
  - tg_autopilot_stop
  - tg_autopilot_status
  - tg_conversation_auto
  - tg_search
  - tg_dialogs
  - tg_read
  - tg_participants
  - tg_join
  - tg_account_qr_confirm
  - tg_account_add
  - tg_account_list
  - tg_account_remove
  - tg_send
  - tg_poll
  - tg_conversations
