name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install ruff pytest
      - run: ruff check . || true
      - run: pytest -q || true
